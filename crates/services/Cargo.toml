[package]
name = "native-shell-services"
description = "Standard library of native-shell: storage, fs, fetch, WebSocket, crypto, signed bundles."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
native-shell-core.workspace = true
rquickjs.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
ed25519-dalek.workspace = true
base64.workspace = true
thiserror.workspace = true
url = "2.5"
getrandom = "0.2"
# One rustls with the `ring` provider for both HTTP and WebSocket: pure Rust plus
# ring's C/asm, which cross-compiles for iOS and Android without cmake (aws-lc does not).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "0.26"
ureq = { version = "2.12", default-features = false, features = ["tls"] }
tungstenite = { version = "0.28", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }

[dev-dependencies]
tempfile = "3"

# quickjs-jit-sys ships pre-generated bindings for desktop triples only; mobile
# triples generate them at build time (needs libclang, present with Xcode).
[target.'cfg(any(target_os = "ios", target_os = "android"))'.dependencies]
rquickjs = { workspace = true, features = ["bindgen"] }
