# The GTK 4 renderer is its own workspace: it needs the GTK development
# libraries, which the root workspace (built on macOS and in the Android job)
# must not require.
[workspace]

[package]
name = "native-shell-gtk"
description = "GTK 4 renderer of native-shell for Linux desktops."
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
native-shell = { path = "../../crates/engine" }
native-shell-core = { path = "../../crates/core" }
native-shell-services = { path = "../../crates/services" }
gtk = { package = "gtk4", version = "0.11", features = ["v4_18"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_7"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-channel = "2"
pangocairo = "0.22"
# Network images: the same HTTP stack as the services crate (rustls with ring).
ureq = { version = "2.12", default-features = false, features = ["tls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "0.26"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "unwind"

# GTK runs on one thread per process: each test file is its own harness
# (tests/support/mod.rs).
[[test]]
name = "surface"
harness = false

[[test]]
name = "scroll_list"
harness = false

[[test]]
name = "text"
harness = false

[[test]]
name = "controls"
harness = false

[[test]]
name = "host"
harness = false

[[test]]
name = "input"
harness = false

[[test]]
name = "base_view"
harness = false

[[test]]
name = "overlays"
harness = false

[[test]]
name = "examples"
harness = false

[[test]]
name = "dev"
harness = false

[[test]]
name = "component_forms"
harness = false
