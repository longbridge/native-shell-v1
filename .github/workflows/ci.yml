name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust:
    name: cargo test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install TypeScript (the CLI's typings test runs tsc)
        run: npm install -g typescript@5.6.3
      - name: Test
        env:
          NATIVE_SHELL_REQUIRE_TSC: "1"
        run: cargo test --workspace --all-features
      - name: Test ffi without the jni feature
        run: cargo test -p native-shell-ffi
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Check the examples
        if: hashFiles('examples/*/native-shell.json') != ''
        run: |
          for d in examples/*/; do
            [ -f "$d/native-shell.json" ] || continue
            registry=()
            [ -f "$d/host.json" ] && registry=(--registry "$d/host.json")
            cargo run -q -p native-shell-cli -- check "$d" "${registry[@]}"
          done

  linux:
    name: Linux (GTK 4 renderer)
    runs-on: ubuntu-latest
    # The renderer needs GTK 4.18 and libadwaita 1.7, newer than the runner's own.
    container: ubuntu:26.04
    env:
      GDK_BACKEND: broadway
      BROADWAY_DISPLAY: ":5"
    steps:
      - name: Install GTK, libadwaita, Broadway and fonts
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates curl git build-essential pkg-config \
            libgtk-4-dev libgtk-4-bin libadwaita-1-dev adwaita-icon-theme \
            fonts-noto-core fonts-noto-cjk fonts-noto-color-emoji
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: platforms/linux
      - name: Start a headless Broadway display
        run: |
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/xdg"
          mkdir -p -m 700 "$XDG_RUNTIME_DIR"
          echo "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR" >> "$GITHUB_ENV"
          echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
          nohup gtk4-broadwayd :5 > "$RUNNER_TEMP/broadwayd.log" 2>&1 &
          for _ in $(seq 50); do [ -S "$XDG_RUNTIME_DIR/broadway6.socket" ] && break; sleep 0.1; done
      - name: Test
        working-directory: platforms/linux
        run: cargo test
      - name: Clippy
        working-directory: platforms/linux
        run: cargo clippy --all-targets -- -D warnings

  ios:
    name: iOS (xcframework + XCTest)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - uses: Swatinem/rust-cache@v2
      - name: Build NativeShellFFI.xcframework
        run: scripts/build-ios.sh
      - name: XCTest on the simulator
        working-directory: platforms/ios
        run: |
          DEVICE=$(xcrun simctl list devices available -j \
            | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["name"] for k,v in d.items() if "iOS" in k for x in v if x["name"].startswith("iPhone")))')
          xcodebuild test -scheme NativeShell -destination "platform=iOS Simulator,name=$DEVICE"

  android:
    name: Android (.so + JVM tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Install the NDK
        run: sdkmanager "ndk;27.2.12479018"
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Build libnative_shell.so (16 KB aligned)
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/27.2.12479018
        run: scripts/build-android.sh
      - name: JVM unit tests
        working-directory: platforms/android
        run: ./gradlew :native-shell:testDebugUnitTest
